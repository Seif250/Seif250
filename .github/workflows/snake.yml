name: Generate Snake Animation

on:
  schedule:
    # يشتغل كل يوم الساعة 12 بالليل UTC (تقدر تغيّرها)
    - cron: "0 0 * * *"
  workflow_dispatch: {}  # يسمحلك تشغّله يدوي من تبويب Actions
  push:
    branches:
      - main  # يشتغل أول ما تعمل push على main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate a snake game from a github contribution grid
        uses: Platane/snk@v3
        with:
          github_user_name: Seif250
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push output to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
